<div class="appointments-container">
  <div class="header">
    <h2>My Appointments</h2>
    <button mat-raised-button color="primary" (click)="openBookAppointmentDialog()">
      <mat-icon>add</mat-icon> Book Appointment
    </button>
  </div>

  <div class="appointments-list">
    <mat-card *ngFor="let appointment of appointments" class="appointment-card">
      <mat-card-header>
        <mat-card-title>Appointment #{{appointment.id}}</mat-card-title>
        <mat-card-subtitle>
          {{appointment.date | date:'medium'}} with {{appointment.doctor}}
        </mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <p>Status: <span [class]="appointment.status">{{appointment.status | titlecase}}</span></p>
        <p>Specialization: {{appointment.specialization}}</p>
      </mat-card-content>
      <mat-card-actions>
        <button mat-button color="warn" (click)="cancelAppointment(appointment)" *ngIf="appointment.status === 'scheduled'">
          <mat-icon>cancel</mat-icon> Cancel
        </button>
        <button mat-button color="primary" (click)="rescheduleAppointment(appointment)" *ngIf="appointment.status === 'scheduled'">
          <mat-icon>schedule</mat-icon> Reschedule
        </button>
      </mat-card-actions>
    </mat-card>

    <div *ngIf="appointments.length === 0" class="no-appointments">
      <mat-icon>event_busy</mat-icon>
      <p>No appointments scheduled yet.</p>
      <button mat-raised-button color="primary" (click)="openBookAppointmentDialog()">
        Book Your First Appointment
      </button>
    </div>
  </div>
</div>
