<div class="patient-dashboard">
  <div class="dashboard-header">
    <h1>Patient Dashboard</h1>
    <p>Welcome back! Here's an overview of your appointments and health data.</p>
  </div>

  <div class="dashboard-content">
    <div class="dashboard-cards">
      <!-- Upcoming Appointments -->
      <mat-card class="dashboard-card">
        <mat-card-header>
          <mat-card-title>Upcoming Appointments</mat-card-title>
          <mat-card-subtitle>Your next visits</mat-card-subtitle>
          <button mat-icon-button [matMenuTriggerFor]="appointmentMenu" class="menu-button">
            <mat-icon>more_vert</mat-icon>
          </button>
          <mat-menu #appointmentMenu="matMenu">
            <button mat-menu-item>
              <mat-icon>add</mat-icon>
              <span>New Appointment</span>
            </button>
            <button mat-menu-item>
              <mat-icon>list</mat-icon>
              <span>View All</span>
            </button>
          </mat-menu>
        </mat-card-header>
        <mat-card-content>
          <div class="empty-state" *ngIf="true">
            <mat-icon>event_available</mat-icon>
            <p>No upcoming appointments</p>
            <button mat-raised-button color="primary" routerLink="/patient/appointments">
              Book an Appointment
            </button>
          </div>
        </mat-card-content>
      </mat-card>

      <!-- Quick Actions -->
      <mat-card class="dashboard-card">
        <mat-card-header>
          <mat-card-title>Quick Actions</mat-card-title>
          <mat-card-subtitle>Common tasks</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
          <div class="quick-actions">
            <button mat-button class="action-button" routerLink="/patient/appointments/book">
              <mat-icon>add_circle</mat-icon>
              <span>Book Appointment</span>
            </button>
            <button mat-button class="action-button" routerLink="/patient/prescriptions">
              <mat-icon>medication</mat-icon>
              <span>My Prescriptions</span>
            </button>
            <button mat-button class="action-button" routerLink="/patient/medical-records">
              <mat-icon>medical_services</mat-icon>
              <span>Medical Records</span>
            </button>
            <button mat-button class="action-button" routerLink="/patient/billing">
              <mat-icon>receipt</mat-icon>
              <span>Billing</span>
            </button>
          </div>
        </mat-card-content>
      </mat-card>
    </div>

    <!-- Recent Activity -->
    <mat-card class="recent-activity">
      <mat-card-header>
        <mat-card-title>Recent Activity</mat-card-title>
        <mat-card-subtitle>Your latest interactions</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <div class="empty-state">
          <mat-icon>history</mat-icon>
          <p>No recent activity</p>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>
