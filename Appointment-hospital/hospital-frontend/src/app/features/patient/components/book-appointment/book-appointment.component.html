<h2 mat-dialog-title>Book an Appointment</h2>
<mat-dialog-content>
  <form [formGroup]="appointmentForm" (ngSubmit)="onSubmit()">
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Select Doctor</mat-label>
      <mat-select formControlName="doctor" (selectionChange)="onDoctorSelect($event)">
        <mat-option *ngFor="let doctor of doctors" [value]="doctor.id">
          {{doctor.name}} - {{doctor.specialization}}
        </mat-option>
      </mat-select>
      <mat-error *ngIf="appointmentForm.get('doctor')?.hasError('required')">
        Please select a doctor
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Choose a date</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="date">
      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
      <mat-error *ngIf="appointmentForm.get('date')?.hasError('required')">
        Please select a date
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Select Time Slot</mat-label>
      <mat-select formControlName="time">
        <mat-option *ngFor="let slot of doctors[0]?.availableSlots" [value]="slot">
          {{slot}}
        </mat-option>
      </mat-select>
      <mat-error *ngIf="appointmentForm.get('time')?.hasError('required')">
        Please select a time slot
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Reason for visit</mat-label>
      <textarea matInput formControlName="reason" rows="3"></textarea>
      <mat-error *ngIf="appointmentForm.get('reason')?.hasError('required')">
        Please provide a reason for your visit
      </mat-error>
      <mat-error *ngIf="appointmentForm.get('reason')?.hasError('minlength')">
        Reason should be at least 10 characters long
      </mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-raised-button 
          color="primary" 
          [disabled]="!appointmentForm.valid || loading"
          (click)="onSubmit()">
    <span *ngIf="!loading">Book Appointment</span>
    <mat-spinner *ngIf="loading" diameter="20"></mat-spinner>
  </button>
</mat-dialog-actions>
