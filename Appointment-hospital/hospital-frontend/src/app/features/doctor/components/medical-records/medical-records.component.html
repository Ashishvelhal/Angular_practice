<div class="medical-records">
  <div class="page-header">
    <h1>Medical Records</h1>
    <p>View and manage patient medical records</p>
  </div>

  <div class="search-section">
    <mat-card>
      <mat-card-content>
        <div class="search-bar">
          <mat-form-field appearance="outline" class="search-field">
            <mat-label>Search Patients</mat-label>
            <input matInput placeholder="Search by name, ID, or email">
            <mat-icon matSuffix>search</mat-icon>
          </mat-form-field>
          <button mat-raised-button color="primary">Search</button>
        </div>
      </mat-card-content>
    </mat-card>
  </div>

  <div class="records-table">
    <mat-card>
      <mat-card-header>
        <mat-card-title>Recent Medical Records</mat-card-title>
        <mat-card-subtitle>Showing latest patient records</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <table mat-table [dataSource]="[]">
          <!-- Patient Column -->
          <ng-container matColumnDef="patient">
            <th mat-header-cell *matHeaderCellDef>Patient</th>
            <td mat-cell *matCellDef="let record">
              <div class="patient-info">
                <div class="patient-name">John Doe</div>
                <div class="patient-id">ID: #12345</div>
              </div>
            </td>
          </ng-container>

          <!-- Date Column -->
          <ng-container matColumnDef="date">
            <th mat-header-cell *matHeaderCellDef>Date</th>
            <td mat-cell *matCellDef="let record">Dec 4, 2024</td>
          </ng-container>

          <!-- Diagnosis Column -->
          <ng-container matColumnDef="diagnosis">
            <th mat-header-cell *matHeaderCellDef>Diagnosis</th>
            <td mat-cell *matCellDef="let record">Hypertension</td>
          </ng-container>

          <!-- Treatment Column -->
          <ng-container matColumnDef="treatment">
            <th mat-header-cell *matHeaderCellDef>Treatment</th>
            <td mat-cell *matCellDef="let record">Medication prescribed</td>
          </ng-container>

          <!-- Actions Column -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let record">
              <button mat-icon-button color="primary">
                <mat-icon>visibility</mat-icon>
              </button>
              <button mat-icon-button color="accent">
                <mat-icon>edit</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="['patient', 'date', 'diagnosis', 'treatment', 'actions']"></tr>
          <tr mat-row *matRowDef="let row; columns: ['patient', 'date', 'diagnosis', 'treatment', 'actions'];"></tr>
        </table>
      </mat-card-content>
    </mat-card>
  </div>
</div>
