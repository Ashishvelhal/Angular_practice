<div class="billing">
  <div class="page-header">
    <h1>Billing</h1>
    <p>Manage patient billing and payments</p>
  </div>

  <div class="billing-stats">
    <div class="stat-cards">
      <mat-card class="stat-card">
        <mat-card-content>
          <div class="stat-icon">
            <mat-icon>payments</mat-icon>
          </div>
          <div class="stat-content">
            <div class="stat-value">$12,450</div>
            <div class="stat-label">Total Revenue</div>
          </div>
        </mat-card-content>
      </mat-card>

      <mat-card class="stat-card">
        <mat-card-content>
          <div class="stat-icon">
            <mat-icon>receipt_long</mat-icon>
          </div>
          <div class="stat-content">
            <div class="stat-value">28</div>
            <div class="stat-label">Pending Bills</div>
          </div>
        </mat-card-content>
      </mat-card>

      <mat-card class="stat-card">
        <mat-card-content>
          <div class="stat-icon">
            <mat-icon>check_circle</mat-icon>
          </div>
          <div class="stat-content">
            <div class="stat-value">156</div>
            <div class="stat-label">Paid Bills</div>
          </div>
        </mat-card-content>
      </mat-card>
    </div>
  </div>

  <div class="billing-table">
    <mat-card>
      <mat-card-header>
        <mat-card-title>Recent Bills</mat-card-title>
        <mat-card-subtitle>Latest billing transactions</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <table mat-table [dataSource]="[]">
          <!-- Patient Column -->
          <ng-container matColumnDef="patient">
            <th mat-header-cell *matHeaderCellDef>Patient</th>
            <td mat-cell *matCellDef="let bill">
              <div class="patient-info">
                <div class="patient-name">John Doe</div>
                <div class="patient-id">#12345</div>
              </div>
            </td>
          </ng-container>

          <!-- Date Column -->
          <ng-container matColumnDef="date">
            <th mat-header-cell *matHeaderCellDef>Date</th>
            <td mat-cell *matCellDef="let bill">Dec 4, 2024</td>
          </ng-container>

          <!-- Amount Column -->
          <ng-container matColumnDef="amount">
            <th mat-header-cell *matHeaderCellDef>Amount</th>
            <td mat-cell *matCellDef="let bill">$250.00</td>
          </ng-container>

          <!-- Status Column -->
          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef>Status</th>
            <td mat-cell *matCellDef="let bill">
              <span class="status-badge paid">Paid</span>
            </td>
          </ng-container>

          <!-- Actions Column -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let bill">
              <button mat-icon-button color="primary">
                <mat-icon>visibility</mat-icon>
              </button>
              <button mat-icon-button color="accent">
                <mat-icon>download</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="['patient', 'date', 'amount', 'status', 'actions']"></tr>
          <tr mat-row *matRowDef="let row; columns: ['patient', 'date', 'amount', 'status', 'actions'];"></tr>
        </table>
      </mat-card-content>
    </mat-card>
  </div>
</div>
