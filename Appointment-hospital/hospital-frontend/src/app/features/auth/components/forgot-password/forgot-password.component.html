<div class="forgot-password-container">
  <mat-card class="forgot-password-card">
    <mat-card-header class="forgot-password-header">
      <mat-card-title>Reset Password</mat-card-title>
      <mat-card-subtitle>Enter your email address and we'll send you a link to reset your password.</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" class="forgot-password-form">
        <mat-form-field appearance="outline" class="form-field">
          <mat-label>Email Address</mat-label>
          <input matInput type="email" formControlName="email" placeholder="Enter your registered email address">
          <mat-icon matSuffix>email</mat-icon>
          <mat-error *ngIf="forgotPasswordForm.get('email')?.hasError('required')">
            Email address is required
          </mat-error>
          <mat-error *ngIf="forgotPasswordForm.get('email')?.hasError('email')">
            Please enter a valid email address
          </mat-error>
        </mat-form-field>

        <button mat-raised-button 
                color="primary" 
                type="submit" 
                class="reset-button"
                [disabled]="forgotPasswordForm.invalid || isLoading">
          <span *ngIf="!isLoading">Send Reset Link</span>
          <mat-spinner *ngIf="isLoading" diameter="24"></mat-spinner>
        </button>

        <div class="back-to-login">
          <a routerLink="/auth/login" class="back-link">
            <mat-icon>arrow_back</mat-icon>
            Back to Login
          </a>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
