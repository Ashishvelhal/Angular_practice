<mat-sidenav-container class="sidebar-container">
  <mat-sidenav 
    [opened]="!isCollapsed" 
    [mode]="isCollapsed ? 'over' : 'side'"
    [disableClose]="!isCollapsed"
    class="sidebar">
    
    <!-- Sidebar Header -->
    <header class="sidebar-header">
      <div class="user-info">
        <div class="user-avatar">
          <mat-icon>person</mat-icon>
        </div>
        <div class="user-details">
          <div class="user-name" *ngIf="currentUser$ | async as user">
            {{user?.firstName}} {{user?.lastName}}
          </div>
          <div class="user-role" *ngIf="currentUser$ | async as user">
            {{user?.role | titlecase}}
          </div>
        </div>
      </div>
      <button mat-icon-button (click)="toggleSidebar()" class="toggle-btn">
        <mat-icon>{{isCollapsed ? 'chevron_right' : 'chevron_left'}}</mat-icon>
      </button>
    </header>

    <!-- Navigation Menu -->
    <mat-nav-list class="nav-menu">
      <ng-container *ngIf="currentUser$ | async as user">
        <ng-container *ngFor="let item of menuItems">
          <mat-list-item 
            [class.active]="isActiveRoute(item.route)"
            *ngIf="isMenuItemVisible(item, user?.role)"
            (click)="navigateTo(item.route)"
            class="nav-item">
            <mat-icon class="nav-icon">{{item.icon}}</mat-icon>
            <span class="nav-label" *ngIf="!isCollapsed">{{item.label}}</span>
          </mat-list-item>
        </ng-container>
      </ng-container>
    </mat-nav-list>

    <!-- Sidebar Footer -->
    <div class="sidebar-footer">
      <mat-divider></mat-divider>
      <mat-list-item (click)="logout()" class="logout-item">
        <mat-icon class="nav-icon">logout</mat-icon>
        <span class="nav-label" *ngIf="!isCollapsed">Logout</span>
      </mat-list-item>
    </div>
  </mat-sidenav>

  <!-- Main Content Area -->
  <mat-sidenav-content class="main-content">
    <div class="content-wrapper">
      <!-- Top Bar -->
      <header class="top-bar">
        <button mat-icon-button (click)="toggleSidebar()" class="mobile-menu-btn">
          <mat-icon>menu</mat-icon>
        </button>
        <h1 class="page-title">Hospital Management System</h1>
        <div class="header-actions">
          <!-- Profile button for doctors -->
          <ng-container *ngIf="currentUser$ | async as user">
            <button mat-icon-button 
                    *ngIf="user?.role === 'doctor'" 
                    (click)="navigateToProfile()" 
                    class="profile-btn"
                    matTooltip="Profile">
              <mat-icon>person</mat-icon>
            </button>
          </ng-container>
        </div>
      </header>

      <!-- Router Outlet for Page Content -->
      <main class="page-content">
        <router-outlet></router-outlet>
      </main>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
