<div class="sidebar-nav" [class.collapsed]="isCollapsed">
  <!-- Sidebar Header -->
  <header class="sidebar-header">
    <div class="user-info">
      <div class="user-avatar">
        <mat-icon>person</mat-icon>
      </div>
      <div class="user-details">
        <div class="user-name" *ngIf="currentUser$ | async as user">
          {{user?.firstName}} {{user?.lastName}}
        </div>
        <div class="user-role" *ngIf="currentUser$ | async as user">
          {{user?.role | titlecase}}
        </div>
      </div>
    </div>
    <button mat-icon-button (click)="onToggleSidebar()" class="toggle-btn">
      <mat-icon>{{isCollapsed ? 'chevron_right' : 'chevron_left'}}</mat-icon>
    </button>
  </header>

  <!-- Navigation Menu -->
  <mat-nav-list class="nav-menu">
    <ng-container *ngIf="currentUser$ | async as user">
      <ng-container *ngFor="let item of menuItems">
        <mat-list-item 
          [class.active]="isActiveRoute(item.route)"
          *ngIf="isMenuItemVisible(item, user?.role)"
          (click)="navigateTo(item.route)"
          class="nav-item">
          <mat-icon class="nav-icon">{{item.icon}}</mat-icon>
          <span class="nav-label">{{item.label}}</span>
        </mat-list-item>
      </ng-container>
    </ng-container>
  </mat-nav-list>

  <!-- Sidebar Footer -->
  <div class="sidebar-footer">
    <mat-list-item (click)="logout()" class="logout-item">
      <mat-icon class="nav-icon">logout</mat-icon>
      <span class="nav-label">Logout</span>
    </mat-list-item>
  </div>
</div>
